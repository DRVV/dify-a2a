# Pytest configuration file
# This file provides additional configuration beyond what's in pyproject.toml

[tool:pytest]
# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Default options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=orchestrator
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires environment setup)
    slow: Slow tests (performance, stress tests)
    backward_compatibility: Tests for backward compatibility
    requires_env: Tests requiring specific environment configuration
    performance: Performance and benchmarking tests

# Filters
filterwarnings =
    error
    ignore::DeprecationWarning:dify_orch.*
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration
[coverage:run]
source = orchestrator
omit = 
    tests/*
    */test_*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
