[project]
name = "dify-orch"
version = "0.1.0"
description = "Dify Orchestrator Client"
requires-python = ">=3.8.1"
dependencies = [
    "dify-client>=0.1.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.1",
    "python-dotenv>=1.0.0",
    "requests>=2.25.0",
    "chainlit>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",  # for parallel test execution
    "pytest-html>=3.1.0",   # for HTML test reports
]
dev = [
    "dify-orch[test]",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "orchestrator.py",
    "*.py",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=orchestrator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_env: Tests that require environment setup",
    "backward_compatibility: Backward compatibility tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:dify_orch.*",
]

[tool.coverage.run]
source = ["orchestrator"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88
